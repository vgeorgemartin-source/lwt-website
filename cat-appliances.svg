<svg viewBox="0 0 640 420" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <pattern id="hc" width="12.12" height="21" patternUnits="userSpaceOnUse">
      <g fill="#f5e8cc" stroke="#b07c33" stroke-width="1">
        <polygon points="0,-7 6.06,-3.5 6.06,3.5 0,7 -6.06,3.5 -6.06,-3.5"/>
        <polygon points="12.12,-7 18.18,-3.5 18.18,3.5 12.12,7 6.06,3.5 6.06,-3.5"/>
        <polygon points="6.06,3.5 12.12,7 12.12,14 6.06,17.5 0,14 0,7"/>
        <polygon points="0,14 6.06,17.5 6.06,24.5 0,28 -6.06,24.5 -6.06,17.5"/>
        <polygon points="12.12,14 18.18,17.5 18.18,24.5 12.12,28 6.06,24.5 6.06,17.5"/>
      </g>
    </pattern>
  </defs>

  <!-- eyebrow -->
  <text x="24" y="30" font-size="12" letter-spacing="2" fill="#2e7d4f" font-weight="bold">APPLIANCES · CUSTOM BUFFER SET (CUTAWAY)</text>

  <!-- carton cutaway -->
  <rect x="140" y="70" width="360" height="310" fill="#fdf9f1" stroke="#c9a15f" stroke-width="4"/>
  <line x1="140" y1="70" x2="500" y2="70" stroke="#c9a15f" stroke-width="4" stroke-dasharray="10 6"/>

  <!-- top pad -->
  <rect x="148" y="80" width="344" height="34" fill="url(#hc)" stroke="#7a4f1d" stroke-width="2"/>

  <!-- side cavity buffers -->
  <rect x="148" y="210" width="102" height="128" fill="url(#hc)" stroke="#7a4f1d" stroke-width="2"/>
  <rect x="390" y="210" width="102" height="128" fill="url(#hc)" stroke="#7a4f1d" stroke-width="2"/>

  <!-- base pad -->
  <rect x="148" y="338" width="344" height="34" fill="url(#hc)" stroke="#7a4f1d" stroke-width="2"/>

  <!-- mixer: jar -->
  <path d="M275,138 L365,138 L352,210 L288,210 Z" fill="#e8ede9" stroke="#3c4a43" stroke-width="2.5"/>
  <rect x="270" y="124" width="100" height="14" rx="6" fill="#ffffff" stroke="#3c4a43" stroke-width="2.5"/>
  <path d="M365,150 q26,8 12,40" fill="none" stroke="#3c4a43" stroke-width="2.5"/>
  <!-- mixer: base body -->
  <rect x="258" y="210" width="124" height="128" rx="12" fill="#ffffff" stroke="#3c4a43" stroke-width="2.5"/>
  <circle cx="320" cy="262" r="14" fill="none" stroke="#3c4a43" stroke-width="2"/>
  <rect x="292" y="296" width="56" height="10" rx="5" fill="#e8ede9" stroke="#3c4a43" stroke-width="1.5"/>

  <!-- leaders + labels -->
  <g stroke="#2e7d4f" stroke-width="1.4" fill="none">
    <path d="M492,97 L560,97" stroke-dasharray="4 3"/>
    <path d="M492,274 L560,274" stroke-dasharray="4 3"/>
    <path d="M492,355 L560,355" stroke-dasharray="4 3"/>
    <path d="M140,180 L84,180" stroke-dasharray="4 3"/>
  </g>
  <g font-size="11" fill="#5b5347" letter-spacing="1">
    <text x="564" y="93">TOP</text><text x="564" y="106">PAD</text>
    <text x="564" y="264">CAVITY</text><text x="564" y="277">BUFFER</text><text x="564" y="290">(DIE-CUT)</text>
    <text x="564" y="351">BASE</text><text x="564" y="364">PAD</text>
    <text x="26" y="170">5-PLY</text><text x="26" y="183">CARTON</text>
  </g>

  <text x="24" y="404" font-size="11" letter-spacing="1.5" fill="#8a8072">MIXERS · FANS · WASHING MACHINES — REPLACES THERMOCOLE 1:1</text>
</svg>
