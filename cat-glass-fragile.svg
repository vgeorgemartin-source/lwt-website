<svg viewBox="0 0 640 420" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <pattern id="hc" width="12.12" height="21" patternUnits="userSpaceOnUse">
      <g fill="#f5e8cc" stroke="#b07c33" stroke-width="1">
        <polygon points="0,-7 6.06,-3.5 6.06,3.5 0,7 -6.06,3.5 -6.06,-3.5"/>
        <polygon points="12.12,-7 18.18,-3.5 18.18,3.5 12.12,7 6.06,3.5 6.06,-3.5"/>
        <polygon points="6.06,3.5 12.12,7 12.12,14 6.06,17.5 0,14 0,7"/>
        <polygon points="0,14 6.06,17.5 6.06,24.5 0,28 -6.06,24.5 -6.06,17.5"/>
        <polygon points="12.12,14 18.18,17.5 18.18,24.5 12.12,28 6.06,24.5 6.06,17.5"/>
      </g>
    </pattern>
  </defs>

  <text x="24" y="30" font-size="12" letter-spacing="2" fill="#2e7d4f" font-weight="bold">GLASS &amp; FRAGILE · U-EDGE PROTECTION FRAME</text>

  <!-- honeycomb frame (outer minus inner) -->
  <path fill-rule="evenodd" fill="url(#hc)" stroke="#7a4f1d" stroke-width="2"
        d="M180,62 L460,62 L460,372 L180,372 Z  M212,94 L428,94 L428,340 L212,340 Z"/>

  <!-- glass panel -->
  <rect x="212" y="94" width="216" height="246" fill="#dbeef2" fill-opacity="0.75" stroke="#6fa8b5" stroke-width="2.5"/>
  <!-- shine -->
  <g stroke="#ffffff" stroke-width="6" opacity="0.8">
    <line x1="250" y1="310" x2="360" y2="130"/>
    <line x1="286" y1="316" x2="392" y2="142"/>
  </g>
  <!-- corner joints -->
  <g stroke="#7a4f1d" stroke-width="1.6">
    <line x1="180" y1="62" x2="212" y2="94"/>
    <line x1="460" y1="62" x2="428" y2="94"/>
    <line x1="180" y1="372" x2="212" y2="340"/>
    <line x1="460" y1="372" x2="428" y2="340"/>
  </g>

  <!-- leaders + labels -->
  <g stroke="#2e7d4f" stroke-width="1.4" fill="none">
    <path d="M460,78 L540,78" stroke-dasharray="4 3"/>
    <path d="M428,220 L540,220" stroke-dasharray="4 3"/>
    <path d="M180,356 L104,356" stroke-dasharray="4 3"/>
  </g>
  <g font-size="11" fill="#5b5347" letter-spacing="1">
    <text x="544" y="70">U-EDGE</text><text x="544" y="83">FRAME</text>
    <text x="544" y="210">GLASS ·</text><text x="544" y="223">PANELS ·</text><text x="544" y="236">ELECTRONICS</text>
    <text x="30" y="346">MITRED</text><text x="30" y="359">CORNERS</text>
  </g>

  <text x="24" y="404" font-size="11" letter-spacing="1.5" fill="#8a8072">EDGES CARRY THE LOAD — SURFACES NEVER TOUCH THE BOX</text>
</svg>
